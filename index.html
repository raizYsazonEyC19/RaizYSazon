<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raíz y Sazón</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar">

    <div class="logo-nav">
        🌿 <strong>Raíz y Sazón</strong>
    </div>

    <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#productos">Catálogo</a></li>
        <li><a href="#contacto">Contacto</a></li>
    </ul>

</nav>

<header class="hero" id="inicio">

    <div class="hero-contenido">

        <div class="logo">
            🌿
        </div>

        <h1>Raíz y Sazón</h1>

        <p class="subtitulo">
            ESPECIAS • CONDIMENTOS • HIERBAS
        </p>

        <p class="frase">
            Sabor que nace de la tierra
        </p>

        <a href="#catalogo" class="boton">
            Ver catálogo
        </a>

    </div>

</header>

<section class="busqueda">

    <input
        id="buscar"
        type="text"
        placeholder="🔍 Buscar producto..."
    >

</section>

<section id="catalogo">

    <h2>Nuestros Productos</h2>

<div class="categorias">

<button class="categoria" data-categoria="Todos">🌾 Todos</button>

<button class="categoria" data-categoria="Chiles">🌶️ Chiles</button>

<button class="categoria" data-categoria="Especias">🧂 Especias</button>

<button class="categoria" data-categoria="Hierbas">🌿 Hierbas</button>

<button class="categoria" data-categoria="Semillas">🌰 Semillas</button>

<button class="categoria" data-categoria="Tés">🍵 Tés</button>

</div>

    <div id="productos"></div>

</section>

<section class="contacto" id="contacto">

    <h2>¿Necesitas ayuda?</h2>

    <p>Contáctanos por WhatsApp para solicitar una cotización.</p>

    <a
        id="btnWhatsapp"
        href="#"
    >
        📲 Pedir por WhatsApp
    </a>

</section>

<footer>

    © 2026 Raíz y Sazón

</footer>

<script src="productos.js"></script>
<script src="script.js"></script>

</body>
</html>
